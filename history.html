<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Order History</title>

  <style>

    body {
        font-family: Arial;
        margin: 0;
        color: white;
        background: #0b0b0b;
    }

    /* BOX */
    .container {
        max-width: 800px;
        margin: 40px auto;
    }

    /* ORDER CARD */
    .order {
        background: #1a1a1a;
        padding: 15px;
        border-radius: 12px;
        margin-bottom: 20px;
    }

    .order h3 {
        margin: 0 0 10px;
        color: #ff6b6b;
    }

    .item {
        font-size: 14px;
        margin-left: 10px;
    }

    /* EMPTY */
    .empty {
        text-align: center;
        margin-top: 50px;
        color: gray;
    }

  </style>
</head>

<body>

<div class="container">
  <h1>📜 Order History</h1>

  <div id="orders"></div>
</div>

<script>

  let orders = JSON.parse(localStorage.getItem("orders")) || [];

  let container = document.getElementById("orders");

  if(orders.length === 0){
      container.innerHTML = `<p class="empty">No orders yet 😢</p>`;
  }else{

      orders.reverse().forEach(order=>{

          let total = order.items.reduce((s,i)=>s + i.price*i.qty,0);

          let html = `
          <div class="order">
              <h3>${order.name} | ₹${total}</h3>
              <p>${order.date}</p>
              <p>📞 ${order.phone}</p>
              <p>📍 ${order.address}</p>
          `;

          order.items.forEach(i=>{
              html += `<div class="item">• ${i.item} x ${i.qty}</div>`;
          });

          html += `</div>`;

          container.innerHTML += html;
      });
  }

</script>

</body>
</html>
