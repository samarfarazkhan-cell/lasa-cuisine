<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Order History</title>

  <style>
    body {
        font-family: Arial;
        margin: 0;
        color: white;
        background: #0b0b0b;
    }

    .container {
        max-width: 800px;
        margin: 40px auto;
    }

    .order {
        background: #1a1a1a;
        padding: 15px;
        border-radius: 12px;
        margin-bottom: 20px;
    }

    .order h3 {
        margin: 0 0 10px;
        color: #ff6b6b;
    }

    .item {
        font-size: 14px;
        margin-left: 10px;
    }

    .empty {
        text-align: center;
        margin-top: 50px;
        color: gray;
    }
  </style>
</head>

<body>

<div class="container">
  <h1>📜 Order History</h1>
  <div id="orders"></div>
</div>

<!-- 🔥 FIREBASE SCRIPT -->
<script type="module">

  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
  import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDdPkJcjawP46Bl81zr6KDl_eGiIwO7dCE",
    authDomain: "lasa-cuisine.firebaseapp.com",
    projectId: "lasa-cuisine",
    storageBucket: "lasa-cuisine.firebasestorage.app",
    messagingSenderId: "653046423280",
    appId: "1:653046423280:web:5739519d03f5c1cb45ac35"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  async function loadOrders(){

    const container = document.getElementById("orders");
    container.innerHTML = "";

    try{
      const querySnapshot = await getDocs(collection(db, "orders"));

      if(querySnapshot.empty){
        container.innerHTML = `<p class="empty">No orders yet 😢</p>`;
        return;
      }

      querySnapshot.forEach(doc => {
        const order = doc.data();

        let html = `
        <div class="order">
          <h3>${order.name || "No Name"} | ₹${order.total || 0}</h3>
          <p>${order.time || "No Time"}</p>
          <p>📞 ${order.phone || "-"}</p>
          <p>📍 ${order.address || "-"}</p>
        `;

        // 🔥 SAFE ITEMS LOOP
        if(order.items && Array.isArray(order.items)){
          order.items.forEach(i=>{
            html += `<div class="item">• ${i.item} x ${i.qty}</div>`;
          });
        }

        html += `</div>`;

        container.innerHTML += html;
      });

    }catch(err){
      console.error("Firebase Error:", err);
      container.innerHTML = `<p class="empty">Error loading orders ❌</p>`;
    }
  }

  loadOrders();

</script>

</body>
</html>
