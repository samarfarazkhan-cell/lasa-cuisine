<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Admin Panel</title>

  <style>
    body {
        font-family: Arial;
        background: #0b0b0b;
        color: white;
        margin: 0;
    }

    h1 { text-align: center; margin-top: 20px; }

    .container { max-width: 900px; margin: auto; }

    .card {
        background: #1a1a1a;
        padding: 15px;
        margin: 15px;
        border-radius: 12px;
    }

    button {
        margin-top: 10px;
        padding: 6px 10px;
        border: none;
        border-radius: 6px;
        cursor: pointer;
    }

    .done { background: green; color: white; }
    .delete { background: red; color: white; }

    .stats {
        display:flex;
        gap:15px;
        flex-wrap:wrap;
        max-width:900px;
        margin:20px auto;
    }
  </style>
</head>

<body>

<!-- 🔐 Login Check -->
<script>
  if(localStorage.getItem("user") !== "admin"){
      alert("Login first");
      window.location.href = "login.html";
  }
</script>

<h1>📊 Admin Panel</h1>

<audio id="sound" src="https://www.soundjay.com/buttons/sounds/beep-07.mp3"></audio>
<div style="text-align:center;">
  <button onclick="logout()">Logout</button>
</div>

<!-- 🔥 STATS -->
<div class="stats">
  <div class="card"><h3>Total Orders</h3><p id="totalOrders">0</p></div>
  <div class="card"><h3>Total Revenue</h3><p id="totalRevenue">₹0</p></div>
  <div class="card"><h3>Today Orders</h3><p id="todayOrders">0</p></div>
</div>

<!-- 🔍 FILTER -->
<div style="text-align:center;">
  <button onclick="filterOrders('all')">All</button>
  <button onclick="filterOrders('Pending')">Pending</button>
  <button onclick="filterOrders('Completed')">Completed</button>
</div>

<div class="container" id="orders"></div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
  import { getFirestore, collection, onSnapshot, doc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDdPkJcjawP46Bl81zr6KDl_eGiIwO7dCE",
    authDomain: "lasa-cuisine.firebaseapp.com",
    projectId: "lasa-cuisine",
    storageBucket: "lasa-cuisine.firebasestorage.app",
    messagingSenderId: "653046423280",
    appId: "1:653046423280:web:5739519d03f5c1cb45ac35"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  const container = document.getElementById("orders");

  let currentFilter = "all";

  onSnapshot(collection(db, "orders"), (snapshot)=>{

      container.innerHTML = "";

      let totalOrders = 0;
      let totalRevenue = 0;
      let todayOrders = 0;

      let today = new Date().toDateString();

      snapshot.forEach(docSnap => {

          const order = docSnap.data();
          const id = docSnap.id;

          if(currentFilter !== "all" && order.status !== currentFilter) return;

          const total = (order.items || []).reduce(
              (s,i)=> s + (i.price||0)*(i.qty||0), 0
          );

          totalOrders++;
          totalRevenue += total;

          if(order.time && new Date(order.time).toDateString() === today){
              todayOrders++;
          }

          let html = `
          <div class="card">
              <h3>₹${total}</h3>
              <p>${order.time || ""}</p>
              <p>👤 ${order.name || ""}</p>
              <p>📞 ${order.phone || ""}</p>
              <p>📍 ${order.address || ""}</p>

              <p style="color:${order.status === 'Pending' ? 'orange' : 'lime'}; font-weight:bold;">
                  ${order.status}
              </p>
          `;

          (order.items || []).forEach(i=>{
              html += `<p>• ${i.item} x ${i.qty}</p>`;
          });

          html += `
              <button class="done" onclick="toggleStatus('${id}', '${order.status}')">
                  ${order.status === "Pending" ? "Mark Completed" : "Mark Pending"}
              </button>

              <button class="delete" onclick="deleteOrder('${id}')">
                  Delete
              </button>
          </div>
          `;

          container.innerHTML += html;
      });

      document.getElementById("totalOrders").innerText = totalOrders;
      document.getElementById("totalRevenue").innerText = "₹" + totalRevenue;
      document.getElementById("todayOrders").innerText = todayOrders;

  });

  window.toggleStatus = async (id, status)=>{
      const ref = doc(db, "orders", id);
      await updateDoc(ref, {
          status: status === "Pending" ? "Completed" : "Pending"
      });
  };

  window.deleteOrder = async (id)=>{
      const ref = doc(db, "orders", id);
      await deleteDoc(ref);
  };

  window.filterOrders = (type)=>{
      currentFilter = type;
  };
</script>

<script>
  function logout(){
      localStorage.removeItem("user");
      window.location.href = "login.html";
  }
</script>

</body>
</html>
