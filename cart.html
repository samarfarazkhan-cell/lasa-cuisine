<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Your Cart</title>

  <style>
    body {
        font-family: Arial;
        margin: 0;
        color: white;
        background:
        linear-gradient(rgba(0,0,0,0.8), rgba(0,0,0,0.9)),
        url("images/bg.jpeg");
        background-size: cover;
    }

    .cart-wrapper {
        max-width: 600px;
        margin: 40px auto;
        padding: 30px;
        background: rgba(20,20,20,0.9);
        border-radius: 15px;
    }

    h1 { text-align: center; }

    .item {
        display: flex;
        justify-content: space-between;
        background: #1a1a1a;
        padding: 10px;
        border-radius: 10px;
        margin-top: 10px;
    }

    button {
        padding: 6px 12px;
        border: none;
        border-radius: 6px;
        cursor: pointer;
    }

    .order-btn {
        width: 100%;
        margin-top: 15px;
        padding: 12px;
        background: #25D366;
        color: white;
    }

    input, textarea {
        width: 100%;
        padding: 10px;
        margin-top: 10px;
        border-radius: 8px;
        border: none;
    }

    #qr {
        display: block;
        margin: 20px auto;
    }
  </style>
</head>

<body>

<script>
  if(!localStorage.getItem("userData")){
      window.location.href = "user-login.html";
  }
</script>

<div class="cart-wrapper">
  <h1>Your Cart 🛒</h1>

  <div id="cart-items"></div>
  <h3 id="total"></h3>

  <input id="name" placeholder="Your Name">
  <input id="phone" placeholder="Phone Number">
  <textarea id="address" placeholder="Address"></textarea>

  <button class="order-btn" onclick="placeOrder()">Place Order ✅</button>
</div>

<script type="module">

  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
  import { getFirestore, addDoc, collection } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDdPkJcjawP46Bl81zr6KDl_eGiIwO7dCE",
    authDomain: "lasa-cuisine.firebaseapp.com",
    projectId: "lasa-cuisine",
    storageBucket: "lasa-cuisine.firebasestorage.app",
    messagingSenderId: "653046423280",
    appId: "1:653046423280:web:5739519d03f5c1cb45ac35"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  // ===== CART =====
  let cart = JSON.parse(localStorage.getItem("cart")) || [];

  // AUTO FILL
  let user = JSON.parse(localStorage.getItem("userData"));
  if(user){
      document.getElementById("name").value = user.name;
      document.getElementById("phone").value = user.phone;
  }

  // LOAD CART
  function loadCart(){
      let container = document.getElementById("cart-items");
      let total = 0;
      container.innerHTML = "";

      if(cart.length === 0){
          container.innerHTML = "<p style='text-align:center;color:gray;'>Cart Empty</p>";
          document.getElementById("total").innerText = "";
          return;
      }

      cart.forEach((item,i)=>{
          total += item.price * item.qty;

          container.innerHTML += `
          <div class="item">
            ${item.item}
            <div>
              <button onclick="dec(${i})">-</button>
              ${item.qty}
              <button onclick="inc(${i})">+</button>
              ₹${item.price * item.qty}
            </div>
          </div>`;
      });

      document.getElementById("total").innerText = "Total: ₹" + total;
  }

  // INC DEC
  window.inc = function(i){ cart[i].qty++; save(); }
  window.dec = function(i){ cart[i].qty--; if(cart[i].qty<=0) cart.splice(i,1); save(); }

  function save(){
      localStorage.setItem("cart", JSON.stringify(cart));
      loadCart();
  }

  // ===== FINAL ORDER FUNCTION =====
  window.placeOrder = async function(){

      let name = document.getElementById("name").value;
      let phone = document.getElementById("phone").value;
      let address = document.getElementById("address").value;

      if(!name || !phone || !address){
          alert("Fill all details");
          return;
      }

      if(cart.length === 0){
          alert("Cart empty");
          return;
      }

      let total = cart.reduce((s,i)=>s + i.price*i.qty,0);

      let orderData = {
          name,
          phone,
          address,
          items: cart,
          total,
          status: "Pending",
          time: new Date().toISOString()
      };

      try{

          await addDoc(collection(db, "orders"), orderData);

          alert("Order Placed ✅");

          // WhatsApp
          let msg = "🛒 New Order\n\n";
          cart.forEach(i=>{
              msg += `${i.item} x ${i.qty} = ₹${i.price*i.qty}\n`;
          });

          msg += `\nTotal: ₹${total}\n\n`;
          msg += `Name: ${name}\nPhone: ${phone}\nAddress: ${address}`;

          window.open(`https://wa.me/919068347740?text=${encodeURIComponent(msg)}`);

          localStorage.removeItem("cart");

          window.location.href = "history.html";

      } catch(e){
          console.error(e);
          alert("Order failed ❌");
      }
  };

  loadCart();

</script>

</body>
</html>
