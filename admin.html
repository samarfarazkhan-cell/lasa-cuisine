<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Admin Panel</title>

  <style>
    body {
        font-family: Arial;
        background: #0b0b0b;
        color: white;
        margin: 0;
    }

    h1 {
        text-align: center;
        margin-top: 20px;
    }

    .top-bar {
        text-align: center;
        margin: 20px;
    }

    input, select {
        padding: 10px;
        border-radius: 8px;
        border: none;
        margin: 5px;
    }

    .stats {
        text-align: center;
    }

    .container {
        max-width: 900px;
        margin: auto;
    }

    .card {
        background: #1a1a1a;
        padding: 15px;
        margin: 15px;
        border-radius: 12px;
    }

    .status {
        font-weight: bold;
        padding: 5px 10px;
        border-radius: 6px;
        display: inline-block;
    }

    button {
        margin-top: 10px;
        padding: 6px 10px;
        border: none;
        border-radius: 6px;
        cursor: pointer;
    }

    .done {
        background: green;
        color: white;
    }

    .delete {
        background: red;
        color: white;
    }

    .clear {
        background: crimson;
        color: white;
        margin: 10px;
    }
  </style>
</head>

<body>

<script>
  let pass = prompt("Enter Admin Password");

  if(pass !== "1234"){
      alert("Access Denied ❌");
      window.location.href = "index.html";
  }
</script>

<h1>📊 Admin Panel</h1>

<div class="top-bar">
  <input type="text" id="search" placeholder="Search name / phone">

  <select id="filter">
    <option value="all">All</option>
    <option value="Pending">Pending</option>
    <option value="Completed">Completed</option>
  </select>

  <select id="dateFilter">
    <option value="all">All Time</option>
    <option value="today">Today</option>
    <option value="week">This Week</option>
  </select>
</div>

<div class="stats">
  <h2 id="totalOrders"></h2>
  <h2 id="revenue"></h2>
</div>

<div style="text-align:center;">
  <button class="clear" onclick="clearAll()">Clear All Orders</button>
</div>

<div class="container" id="orders"></div>

<script>

  let orders = JSON.parse(localStorage.getItem("orders")) || [];

  function loadOrders(){

      let container = document.getElementById("orders");
      container.innerHTML = "";

      let search = document.getElementById("search").value.toLowerCase();
      let filter = document.getElementById("filter").value;
      let dateFilter = document.getElementById("dateFilter").value;

      let totalRevenue = 0;

      let sorted = [...orders].reverse();
      let now = new Date();

      let filtered = sorted.filter(o=>{

          let orderDate = new Date(o.date);

          let matchSearch = o.name.toLowerCase().includes(search) || o.phone.includes(search);
          let matchStatus = (filter === "all") || (o.status === filter);

          let matchDate = true;

          // ✅ VALID DATE
          if(!isNaN(orderDate)){

              if(dateFilter === "today"){
                  matchDate =
                      orderDate.getDate() === now.getDate() &&
                      orderDate.getMonth() === now.getMonth() &&
                      orderDate.getFullYear() === now.getFullYear();
              }

              if(dateFilter === "week"){
                  let diff = (now - orderDate) / (1000 * 60 * 60 * 24);
                  matchDate = diff <= 7;
              }

          }
          // ❗ INVALID DATE
          else{
              if(dateFilter !== "all") return false;
          }

          return matchSearch && matchStatus && matchDate;
      });

      document.getElementById("totalOrders").innerText = "Total Orders: " + filtered.length;

      if(filtered.length === 0){
          container.innerHTML = "<p style='text-align:center;color:gray;'>No Orders Found 📭</p>";
          document.getElementById("revenue").innerText = "₹0";
          return;
      }

      filtered.forEach((order, index)=>{

          let total = order.items.reduce((s,i)=>s + i.price*i.qty,0);
          totalRevenue += total;

          let statusColor = order.status === "Completed" ? "green" : "orange";

          let d = new Date(order.date);
          let formatted = isNaN(d)
    ? order.date
    : d.toLocaleString("en-IN", {
        day: "2-digit",
        month: "short",
        year: "numeric",
        hour: "2-digit",
        minute: "2-digit"
    });


          let html = `
          <div class="card">
              <h3>₹${total}</h3>
              <p>${formatted}</p>
              <p>👤 ${order.name}</p>
              <p>📞 ${order.phone}</p>
              <p>📍 ${order.address}</p>

              <p class="status" style="background:${statusColor};color:white;">
                  ${order.status}
              </p>
          `;

          order.items.forEach(i=>{
              html += `<p>• ${i.item} x ${i.qty}</p>`;
          });

          html += `
              <button class="done" onclick="toggleStatus(${orders.length - 1 - index})">
                  ${order.status === "Pending" ? "Mark Completed" : "Mark Pending"}
              </button>

              <button class="delete" onclick="deleteOrder(${orders.length - 1 - index})">
                  Delete
              </button>
          </div>
          `;

          container.innerHTML += html;
      });

      let label = {
          all: "Total Revenue",
          today: "Today's Revenue",
          week: "Weekly Revenue"
      };

      document.getElementById("revenue").innerText =
          label[dateFilter] + ": ₹" + totalRevenue;
  }

  function toggleStatus(i){
      orders[i].status = orders[i].status === "Completed" ? "Pending" : "Completed";
      localStorage.setItem("orders", JSON.stringify(orders));
      loadOrders();
  }

  function deleteOrder(i){
      if(confirm("Delete this order?")){
          orders.splice(i,1);
          localStorage.setItem("orders", JSON.stringify(orders));
          loadOrders();
      }
  }

  function clearAll(){
      if(confirm("Delete ALL orders?")){
          localStorage.removeItem("orders");
          location.reload();
      }
  }

  document.getElementById("search").addEventListener("input", loadOrders);
  document.getElementById("filter").addEventListener("change", loadOrders);
  document.getElementById("dateFilter").addEventListener("change", loadOrders);

  loadOrders();

</script>

</body>
</html>
