<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Lasa Cuisine</title>

    <style>
        body {
            margin: 0;
            font-family: Arial;
            background: url("images/bg.jpeg");
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: white;
        }

        body::before {
            content: "";
            position: fixed;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            top: 0;
            left: 0;
            z-index: -1;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
        }

        .logo { width: 300px; }

        .right {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .search {
            padding: 12px 18px;
            font-size: 16px;
            width: 220px;
            border-radius: 6px;
            border: 1px solid #555;
            background: transparent;
            color: white;
        }

        .btn, .admin-btn {
            padding: 10px 18px;
            border-radius: 8px;
            text-decoration: none;
            border: 1px solid #ff6b6b;
            color: #ff6b6b;
        }

        .btn:hover, .admin-btn:hover {
            background: #ff6b6b;
            color: white;
        }

        .cart {
            background: #111;
            padding: 10px 18px;
            border-radius: 8px;
            color: white;
            text-decoration: none;
        }

        .badge {
            background: red;
            border-radius: 50%;
            padding: 4px 9px;
            font-size: 13px;
        }

        .container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            padding: 20px 40px;
        }

        .card {
            background: rgba(30,30,30,0.6);
            backdrop-filter: blur(10px);
            padding: 15px;
            border-radius: 15px;
            text-align: center;
        }

        .card img {
            width: 100%;
            height: 150px;
            object-fit: cover;
            border-radius: 10px;
        }

        .price { color: #ff6b6b; font-size: 20px; }

        .qty {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 10px;
        }

        .qty button {
            padding: 8px 14px;
            font-size: 18px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
        }

        .add { background: #ff6b6b; color: white; }

        .footer {
            text-align: center;
            padding: 20px;
            color: gray;
        }
    </style>
</head>

<body>

<!-- 🔐 USER LOGIN CHECK -->
<script>
    if(!localStorage.getItem("userData")){
        window.location.href = "user-login.html";
    }
</script>

<div class="header">
    <img src="images/logo.png" class="logo">

    <div class="right">
        <input type="text" class="search" placeholder="Search food...">

        <a href="admin.html" class="admin-btn" id="adminBtn" style="display:none;">Admin ⚙️</a>
        <a href="history.html" class="btn">Orders 📜</a>

        <a href="cart.html" class="cart">
            Cart 🛒 <span id="cart-count" class="badge">0</span>
        </a>
    </div>
</div>

<div class="container" id="food-list"></div>

<div class="footer">
    © 2025 Lasa Cuisine | Made with ❤️
</div>

<script>

    let cart = JSON.parse(localStorage.getItem("cart")) || [];

    let foods = [
        {name:"Chicken Biryani", price:110, img:"images/chicken_biryani.jpeg"},
        {name:"Chicken Korma", price:110, img:"images/chicken_korma.jpeg"},
        {name:"Chicken Achari", price:130, img:"images/chicken_achari.jpeg"},
        {name:"Hyderabadi Biryani", price:120, img:"images/hyderabadi_biryani.jpeg"},
        {name:"Chicken Afghani", price:130, img:"images/chicken_afghani.jpeg"},
        {name:"Chilli Chicken", price:130, img:"images/chilli_chicken.jpeg"},
        {name:"Tandoori Naan", price:8, img:"images/tandoori_naan.jpeg"},
        {name:"Fried Chicken", price:500, img:"images/fried_chicken.jpeg"}
    ];

    function renderFoods(list){
        let container = document.getElementById("food-list");
        container.innerHTML = "";

        list.forEach(food=>{
            let div = document.createElement("div");
            div.className="card";

            div.innerHTML = `
            <img src="${food.img}">
            <h3>${food.name}</h3>
            <p class="price">₹${food.price}</p>

            <div class="qty">
                <button onclick="dec('${food.name}')">-</button>
                <span id="q-${food.name.replaceAll(" ","")}">0</span>
                <button class="add" onclick="inc('${food.name}',${food.price})">+</button>
            </div>
            `;

            container.appendChild(div);
        });

        updateUI();
    }

    function inc(name,price){
        let item = cart.find(i=>i.item===name);
        if(item) item.qty++;
        else cart.push({item:name,price,qty:1});

        localStorage.setItem("cart",JSON.stringify(cart));
        updateUI();
    }

    function dec(name){
        let item = cart.find(i=>i.item===name);
        if(item){
            item.qty--;
            if(item.qty<=0) cart = cart.filter(i=>i.item!==name);
        }

        localStorage.setItem("cart",JSON.stringify(cart));
        updateUI();
    }

    function updateUI(){
        foods.forEach(f=>{
            let el=document.getElementById("q-"+f.name.replaceAll(" ",""));
            let item=cart.find(i=>i.item===f.name);
            if(el) el.innerText=item?item.qty:0;
        });

        document.getElementById("cart-count").innerText =
            cart.reduce((s,i)=>s+i.qty,0);
    }

    // 🔍 SEARCH
    document.querySelector(".search").addEventListener("input", function(e){
        let value = e.target.value.toLowerCase();
        let filtered = foods.filter(f => f.name.toLowerCase().includes(value));
        renderFoods(filtered);
    });

    // 🔐 ADMIN BUTTON SHOW
    if(localStorage.getItem("user") === "admin"){
        document.getElementById("adminBtn").style.display = "inline-block";
    }

    // INIT
    renderFoods(foods);

</script>

</body>
</html>
