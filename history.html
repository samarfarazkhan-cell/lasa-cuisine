<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Order History</title>

  <style>
    body {
        font-family: Arial;
        margin: 0;
        color: white;
        background: #0b0b0b;
    }

    .container {
        max-width: 800px;
        margin: 40px auto;
    }

    .order {
        background: #1a1a1a;
        padding: 15px;
        border-radius: 12px;
        margin-bottom: 20px;
    }

    .item {
        font-size: 14px;
        margin-left: 10px;
    }

    .empty {
        text-align: center;
        margin-top: 50px;
        color: gray;
    }

    .toast {
        position: fixed;
        bottom: 20px;
        right: 20px;
        background: #4caf50;
        color: white;
        padding: 12px 20px;
        border-radius: 10px;
        display: none;
    }
  </style>
</head>

<body>

<!-- 🔐 LOGIN CHECK -->
<script>
  if(!localStorage.getItem("userData")){
      window.location.href = "user-login.html";
  }
</script>

<div class="container">
  <h1>📜 Order History</h1>
  <div id="orders"></div>
</div>

<div id="toast" class="toast">Order Completed ✅</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
  import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDdPkJcjawP46Bl81zr6KDl_eGiIwO7dCE",
    authDomain: "lasa-cuisine.firebaseapp.com",
    projectId: "lasa-cuisine",
    storageBucket: "lasa-cuisine.firebasestorage.app",
    messagingSenderId: "653046423280",
    appId: "1:653046423280:web:5739519d03f5c1cb45ac35"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  const container = document.getElementById("orders");
  const toast = document.getElementById("toast");

  // 👤 Current user
  let user = JSON.parse(localStorage.getItem("userData"));

  // 🔁 Track previous state
  let prevStatus = {};

  onSnapshot(collection(db, "orders"), (snapshot) => {

      container.innerHTML = "";

      if(snapshot.empty){
          container.innerHTML = "<p class='empty'>No orders yet 😢</p>";
          return;
      }

      let found = false;

      snapshot.forEach(doc => {

          const order = doc.data();
          const id = doc.id;

          // 🔐 FILTER (ONLY USER ORDERS)
          if(user && order.phone !== user.phone) return;

          found = true;

          // 🔔 Notification
          if(prevStatus[id] && prevStatus[id] === "Pending" && order.status === "Completed"){
              showToast();
          }
          prevStatus[id] = order.status;

          const total = (order.items || []).reduce(
              (s,i)=> s + (i.price||0)*(i.qty||0), 0
          );

          let html = `
          <div class="order">
              <h3>${order.name || "User"} | ₹${total}</h3>
              <p>${order.time || ""}</p>
              <p>📞 ${order.phone || ""}</p>
              <p>📍 ${order.address || ""}</p>

              <span style="
                  background:${order.status === 'Pending' ? '#ff9800' : '#4caf50'};
                  padding:5px 12px;
                  border-radius:20px;
                  font-size:13px;
                  color:white;
              ">
                  ${order.status}
              </span>
          `;

          (order.items || []).forEach(i=>{
              html += `<div class="item">• ${i.item} x ${i.qty}</div>`;
          });

          html += `</div>`;

          container.innerHTML += html;
      });

      if(!found){
          container.innerHTML = "<p class='empty'>No orders found 😢</p>";
      }

  });

  // 🔔 Toast
  function showToast(){
      toast.style.display = "block";
      setTimeout(()=>{
          toast.style.display = "none";
      }, 3000);
  }
</script>

</body>
</html>
