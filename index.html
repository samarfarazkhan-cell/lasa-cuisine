<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Lasa Cuisine</title>

    <style>

        body {
            margin: 0;
            font-family: Arial;
            background: url("images/bg.jpeg");
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: white;
        }

        /* DARK OVERLAY */
        body::before {
            content: "";
            position: fixed;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            top: 0;
            left: 0;
            z-index: -1;
        }

        /* HEADER */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
        }

        .logo {
            width: 300px;
            height: auto;
        }

        .right {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .search {
            padding: 10px;
            background: transparent;
            border: 1px solid #555;
            color: white;
            border-radius: 6px;
        }

        .btn {
            border: 1px solid #ff6b6b;
            padding: 8px 15px;
            border-radius: 8px;
            color: #ff6b6b;
            text-decoration: none;
        }

        .cart {
            background: #111;
            padding: 8px 15px;
            border-radius: 8px;
            text-decoration: none;
            color: white;
        }

        .badge {
            background: red;
            border-radius: 50%;
            padding: 3px 8px;
            font-size: 12px;
        }

        /* HERO BANNER */
        .hero {
            margin: 20px auto;
            width: 95%;
            height: 260px;
            border-radius: 15px;

            background: url("images/banner.png");
            background-size: cover;
            background-position: center;

        }

        .overlay {
            background: rgba(0,0,0,0.6);
            padding: 20px 30px;
            border-radius: 10px;
            text-align: center;
        }

        .overlay h1 {
            color: #ff6b6b;
            margin: 0;
        }

        /* GRID */
        .container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            padding: 20px 40px;
        }

        /* CARD */
        .card {
            background: rgba(20,20,20,0.9);
            padding: 15px;
            border-radius: 15px;
            text-align: center;
        }

        .card img {
            width: 100%;
            height: 150px;
            object-fit: cover;
            border-radius: 10px;
        }

        .price {
            color: #ff6b6b;
        }

        /* QTY */
        .qty {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 10px;
        }

        .qty button {
            background: black;
            color: white;
            border: none;
            padding: 5px 12px;
            border-radius: 6px;
            cursor: pointer;
        }

        .add {
            background: #ff6b6b;
        }

        /* FOOTER */
        .footer {
            text-align: center;
            padding: 20px;
            color: gray;
        }

        /* ===== SIZE IMPROVEMENTS (SAFE) ===== */

/* Menu name thoda bada */
.card h3 {
    font-size: 20px;
}

/* Price thoda clear */
.price {
    font-size: 20px;
}

/* Quantity number */
.qty span {
    font-size: 20px;
}

/* - + buttons bigger */
.qty button {
    padding: 8px 14px;
    font-size: 20px;
    border-radius: 8px;
}

        /* ===== HEADER SIZE IMPROVEMENT ===== */

/* Search box bada */
.search {
    padding: 12px 18px;
    font-size: 16px;
    width: 220px;
}

/* Orders button */
.btn {
    padding: 10px 18px;
    font-size: 15px;
}

/* Cart button */
.cart {
    padding: 10px 18px;
    font-size: 15px;
}

/* Cart badge (0 wala red circle) */
.badge {
    font-size: 13px;
    padding: 4px 9px;
}

        /* ===== CARD HOVER EFFECT ===== */
.card {
    transition: 0.3s;
}

.card:hover {
    transform: translateY(-8px);
    box-shadow: 0 10px 25px rgba(255, 107, 107, 0.3);
}

/* ===== IMAGE ZOOM ===== */
.card img {
    transition: 0.3s;
}

.card:hover img {
    transform: scale(1.05);
}

/* ===== BUTTON HOVER ===== */
.qty button {
    transition: 0.2s;
}

.qty button:hover {
    transform: scale(1.1);
}

/* ===== ADD BUTTON GLOW ===== */
.add:hover {
    box-shadow: 0 0 10px #ff6b6b;
}

/* ===== HEADER BUTTON HOVER ===== */
.btn:hover, .cart:hover {
    background: #ff6b6b;
    color: white;
    transition: 0.3s;
}

/* ===== SEARCH FOCUS EFFECT ===== */
.search:focus {
    outline: none;
    border: 1px solid #ff6b6b;
    box-shadow: 0 0 8px #ff6b6b;
}

/* ===== SMOOTH TRANSITIONS GLOBAL ===== */
* {
    transition: 0.2s;
}

        .card {
    background: rgba(30, 30, 30, 0.6);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.08);
}

        body {
    animation: fadeIn 0.6s ease-in-out;
}

@keyframes fadeIn {
    from {
        opacity: 0;
        transform: translateY(10px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

        .card:hover {
    box-shadow: 0 8px 25px rgba(255, 107, 107, 0.25);
}

        h1, h2 {
    letter-spacing: 1px;
}

        .admin-btn {
    padding: 8px 15px;
    border: 1px solid #ff6b6b;
    border-radius: 8px;
    text-decoration: none;
    color: #ff6b6b;
    margin-left: 10px;
}

.admin-btn:hover {
    background: #ff6b6b;
    color: white;
}

    </style>
</head>

<body>

<!-- HEADER -->
<div class="header">
    <img src="images/logo.png" class="logo">

    <div class="right">
        <input type="text" class="search" placeholder="Search food...">
        <a href="admin.html" class="admin-btn">Admin ⚙️</a>
        <a href="history.html" class="btn">Orders 📜</a>
        <a href="cart.html" class="cart">
            Cart 🛒 <span id="cart-count" class="badge">0</span>
        </a>
    </div>
</div>

<!-- HERO -->
<div class="hero">
</div>

<!-- FOOD -->
<div class="container" id="food-list"></div>

<!-- FOOTER -->
<div class="footer">
    © 2025 Lasa Cuisine | Made with ❤️ for food lovers
</div>

<script>

    let cart = JSON.parse(localStorage.getItem("cart")) || [];

    let foods = [
        {name:"Chicken Biryani", price:110, img:"images/chicken_biryani.jpeg"},
        {name:"Chicken Korma", price:110, img:"images/chicken_korma.jpeg"},
        {name:"Chicken Achari", price:130, img:"images/chicken_achari.jpeg"},
        {name:"Hyderabadi Biryani", price:120, img:"images/hyderabadi_biryani.jpeg"},
        {name:"Chicken Afghani", price:130, img:"images/chicken_afghani.jpeg"},
        {name:"Chilli Chicken", price:130, img:"images/chilli_chicken.jpeg"},
        {name:"Tandoori Naan", price:8, img:"images/tandoori_naan.jpeg"},
        {name:"Fried Chicken", price:500, img:"images/fried_chicken.jpeg"}
    ];

    function loadFoods(){
        let container = document.getElementById("food-list");
         container.innerHTML = "";
        foods.forEach(food=>{
            let div = document.createElement("div");
            div.className="card";

            div.innerHTML = `
            <img src="${food.img}">
            <h3>${food.name}</h3>
            <p class="price">₹${food.price}</p>

            <div class="qty">
                <button onclick="dec('${food.name}')">-</button>
                <span id="q-${food.name.replaceAll(" ","")}">0</span>
                <button class="add" onclick="inc('${food.name}',${food.price})">+</button>
            </div>
            `;

            container.appendChild(div);
        });

        updateUI();
    }

    function inc(name,price){

    cart = JSON.parse(localStorage.getItem("cart")) || [];

    let item = cart.find(i=>i.item===name);
        if(item) item.qty++;
        else cart.push({item:name,price:price,qty:1});

        localStorage.setItem("cart",JSON.stringify(cart));
        updateUI();
    }

    function dec(name){

    cart = JSON.parse(localStorage.getItem("cart")) || [];

    let item = cart.find(i=>i.item===name);
        if(item){
            item.qty--;
            if(item.qty<=0) cart = cart.filter(i=>i.item!==name);
        }

        localStorage.setItem("cart",JSON.stringify(cart));
        updateUI();
    }

    function updateUI(){

    cart = JSON.parse(localStorage.getItem("cart")) || [];
        foods.forEach(f=>{
            let el=document.getElementById("q-"+f.name.replaceAll(" ",""));
            let item=cart.find(i=>i.item===f.name);
            if(el) el.innerText=item?item.qty:0;
        });

        document.getElementById("cart-count").innerText =
            cart.reduce((s,i)=>s+i.qty,0);
    }

    loadFoods();

</script>

</body>
</html>
