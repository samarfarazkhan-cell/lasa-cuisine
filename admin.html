<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Admin Panel</title>

  <style>
    body {
        font-family: Arial;
        background: #0b0b0b;
        color: white;
        margin: 0;
    }

    h1 {
        text-align: center;
        margin-top: 20px;
    }

    .container {
        max-width: 900px;
        margin: auto;
    }

    .card {
        background: #1a1a1a;
        padding: 15px;
        margin: 15px;
        border-radius: 12px;
    }

    button {
        margin-top: 10px;
        padding: 6px 10px;
        border: none;
        border-radius: 6px;
        cursor: pointer;
    }

    .done {
        background: green;
        color: white;
    }

    .delete {
        background: red;
        color: white;
    }

  </style>
</head>

<body>

<script>
  let pass = prompt("Enter Admin Password");

  if(pass !== "1234"){
      alert("Access Denied ❌");
      window.location.href = "index.html";
  }
</script>

<h1>📊 Admin Panel</h1>

<div class="container" id="orders"></div>

<!-- 🔥 FIREBASE + LOGIC -->
<script type="module">

  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
  import { getFirestore, collection, getDocs, deleteDoc, doc, updateDoc } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDdPkJcjawP46Bl81zr6KDl_eGiIwO7dCE",
    authDomain: "lasa-cuisine.firebaseapp.com",
    projectId: "lasa-cuisine",
    storageBucket: "lasa-cuisine.firebasestorage.app",
    messagingSenderId: "653046423280",
    appId: "1:653046423280:web:5739519d03f5c1cb45ac35"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  async function loadOrders(){

    const container = document.getElementById("orders");
    container.innerHTML = "";

    const querySnapshot = await getDocs(collection(db, "orders"));

    if(querySnapshot.empty){
      container.innerHTML = "<p style='text-align:center;color:gray;'>No Orders 📭</p>";
      return;
    }

    querySnapshot.forEach((docSnap) => {

      const order = docSnap.data();
      const id = docSnap.id;

      let statusColor = order.status === "Completed" ? "green" : "orange";

      let html = `
      <div class="card">
        <h3>₹${order.total}</h3>
        <p>${order.time}</p>
        <p>👤 ${order.name}</p>
        <p>📞 ${order.phone}</p>
        <p>📍 ${order.address}</p>

        <p style="color:${statusColor}; font-weight:bold;">
          ${order.status}
        </p>
      `;

      order.items.forEach(i=>{
        html += `<p>• ${i.item} x ${i.qty}</p>`;
      });

      html += `
        <button class="done" onclick="toggleStatus('${id}', '${order.status}')">
          Toggle Status
        </button>

        <button class="delete" onclick="deleteOrder('${id}')">
          Delete
        </button>
      </div>
      `;

      container.innerHTML += html;
    });
  }

  // 🔥 DELETE
  window.deleteOrder = async function(id){
    await deleteDoc(doc(db, "orders", id));
    loadOrders();
  }

  // 🔥 STATUS CHANGE
  window.toggleStatus = async function(id, status){
    let newStatus = status === "Pending" ? "Completed" : "Pending";
    await updateDoc(doc(db, "orders", id), { status: newStatus });
    loadOrders();
  }

  // START
  loadOrders();

</script>

</body>
</html>
