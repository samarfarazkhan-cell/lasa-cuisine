<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Cart</title>

  <style>
    body {
        font-family: Arial;
        background: #f5f5f5;
        padding: 20px;
    }

    h1 { text-align: center; }

    .item {
        background: white;
        padding: 15px;
        margin: 10px 0;
        border-radius: 10px;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .controls button {
        margin: 0 5px;
        padding: 5px 10px;
        background: black;
        color: white;
        border: none;
        border-radius: 5px;
    }

    /* CENTER BUTTON */
    .whatsapp-btn {
        display: block;
        width: 250px;
        margin: 20px auto;
        background: green;
        color: white;
        padding: 12px;
        border-radius: 8px;
        border: none;
        cursor: pointer;
    }

    /* FORM */
    .form-box {
        background: white;
        padding: 20px;
        border-radius: 10px;
        width: 320px;
        margin: 20px auto;
    }

    input, textarea {
        width: 100%;
        padding: 8px;
        margin-bottom: 10px;
    }

    button {
        display: block;
        margin: 10px auto;
        padding: 10px;
        background: black;
        color: white;
        border-radius: 8px;
        border: none;
    }
  </style>
</head>

<body>

<h1>Your Cart 🛒</h1>

<div id="cart-items"></div>
<h3 id="total">Total: ₹0</h3>

<div class="form-box">
  <h3>Customer Details</h3>

  <input type="text" id="name" placeholder="Your Name">
  <input type="tel" id="phoneInput" placeholder="Phone Number">
  <textarea id="address" placeholder="Address"></textarea>

  <h3>Select Payment</h3>

  <label><input type="radio" name="payment" value="COD" checked> COD</label>
  <label><input type="radio" name="payment" value="UPI"> UPI</label>

  <button onclick="placeOrder()">Place Order</button>
</div>

<script>
  let cart = JSON.parse(localStorage.getItem("cart")) || [];

  function displayCart() {
      let container = document.getElementById("cart-items");

      if (cart.length === 0) {
          container.innerHTML = "<h3>Your cart is empty 😢</h3>";
          document.getElementById("total").textContent = "";
          return;
      }

      container.innerHTML = "";
      let total = 0;

      cart.forEach(item => {
          let itemTotal = item.price * item.qty;
          total += itemTotal;

          let div = document.createElement("div");
          div.className = "item";

          div.innerHTML = `
              <span>${item.item}</span>
              <div class="controls">
                  <button onclick="decrease('${item.item}')">➖</button>
                  ${item.qty}
                  <button onclick="increase('${item.item}')">➕</button>
                  ₹${itemTotal}
              </div>
          `;
          container.appendChild(div);
      });

      document.getElementById("total").textContent = "Total: ₹" + total;
  }

  function increase(name) {
      let item = cart.find(i => i.item === name);
      if (item) item.qty++;
      localStorage.setItem("cart", JSON.stringify(cart));
      displayCart();
  }

  function decrease(name) {
      let item = cart.find(i => i.item === name);
      if (item) {
          item.qty--;
          if (item.qty <= 0) cart = cart.filter(i => i.item !== name);
      }
      localStorage.setItem("cart", JSON.stringify(cart));
      displayCart();
  }

      let name = document.getElementById("name").value || "Customer";
      let phone = document.getElementById("phoneInput").value || "-";
      let address = document.getElementById("address").value || "-";

      let msg = `🛒 Order\n\nName: ${name}\nPhone: ${phone}\nAddress: ${address}\n\n`;

      cart.forEach(i => {
          msg += `${i.item} x ${i.qty} = ₹${i.price * i.qty}\n`;
      });

      let total = cart.reduce((s, i) => s + i.price * i.qty, 0);
      msg += `\nTotal: ₹${total}`;

      window.open(`https://wa.me/919068347740?text=${encodeURIComponent(msg)}`);
  }

  function placeOrder() {
   let total = cart.reduce((sum, i) => sum + i.price * i.qty, 0);

    // 🟢 SAVE ORDER
    let orders = JSON.parse(localStorage.getItem("orders")) || [];

    orders.push({
        items: cart,
        total: total,
        date: new Date().toLocaleString(),
        status: "Pending"
    });

    localStorage.setItem("orders", JSON.stringify(orders));

      alert("Order placed!");
      localStorage.removeItem("cart");
      window.location.href = "index.html";
  }

  displayCart();
</script>

</body>
</html>
