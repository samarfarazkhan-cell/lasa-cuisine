<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Your Cart</title>

  <style>
    body {
        font-family: Arial;
        margin: 0;
        color: white;
        background:
        linear-gradient(rgba(0,0,0,0.8), rgba(0,0,0,0.9)),
        url("images/bg.jpeg");
        background-size: cover;
        background-position: center;
    }

    .cart-wrapper {
        max-width: 600px;
        margin: 40px auto;
        padding: 30px;
        background: rgba(20,20,20,0.9);
        border-radius: 15px;
    }

    h1 { text-align: center; }

    .item {
        display: flex;
        justify-content: space-between;
        background: #1a1a1a;
        padding: 10px;
        border-radius: 10px;
        margin-top: 10px;
    }

    .qty button {
        padding: 6px 12px;
        border: none;
        background: black;
        color: white;
        border-radius: 6px;
        cursor: pointer;
    }

    #total {
        text-align: center;
        margin-top: 20px;
        color: #ff6b6b;
    }

    input, textarea {
        width: 100%;
        padding: 10px;
        margin-top: 10px;
        border-radius: 8px;
        border: none;
    }

    .order-btn {
        width: 100%;
        margin-top: 20px;
        padding: 12px;
        background: #25D366;
        border: none;
        border-radius: 8px;
        color: white;
        cursor: pointer;
    }
  </style>
</head>

<body>

<div class="cart-wrapper">
  <h1>Your Cart 🛒</h1>

  <div id="cart-items"></div>
  <h3 id="total"></h3>

  <input type="text" id="name" placeholder="Your Name">
  <input type="text" id="phone" placeholder="Phone Number">
  <textarea id="address" placeholder="Address"></textarea>

  <button class="order-btn" onclick="placeOrder()">Order on WhatsApp</button>
</div>

<script>
  let cart = JSON.parse(localStorage.getItem("cart")) || [];

  function loadCart(){
      let container = document.getElementById("cart-items");
      let total = 0;
      container.innerHTML = "";

      if(cart.length === 0){
          container.innerHTML = "<p style='text-align:center;color:gray;'>Cart empty</p>";
          return;
      }

      cart.forEach((item, i)=>{
          total += item.price * item.qty;

          container.innerHTML += `
          <div class="item">
            ${item.item}
            <div class="qty">
              <button onclick="dec(${i})">-</button>
              <span>${item.qty}</span>
              <button onclick="inc(${i})">+</button>
              ₹${item.price * item.qty}
            </div>
          </div>`;
      });

      document.getElementById("total").innerText = "Total: ₹" + total;
  }

  function inc(i){ cart[i].qty++; save(); }
  function dec(i){ cart[i].qty--; if(cart[i].qty<=0) cart.splice(i,1); save(); }

  function save(){
      localStorage.setItem("cart", JSON.stringify(cart));
      loadCart();
  }

  function placeOrder(){

      let name = document.getElementById("name").value;
      let phone = document.getElementById("phone").value;
      let address = document.getElementById("address").value;

      if(!name || !phone || !address){
          alert("Fill all details");
          return;
      }

      if(cart.length === 0){
          alert("Cart empty");
          return;
      }

      let total = cart.reduce((s,i)=>s + i.price*i.qty,0);

      let orderData = {
          name, phone, address,
          items: cart,
          total,
          status: "Pending",
          time: new Date().toLocaleString()
      };

      // WhatsApp
      let msg = "🛒 New Order\n\n";
      cart.forEach(i=>{
          msg += `${i.item} x ${i.qty} = ₹${i.price*i.qty}\n`;
      });

      msg += `\nTotal: ₹${total}\n\n`;
      msg += `Name: ${name}\nPhone: ${phone}\nAddress: ${address}`;

      window.open(`https://wa.me/919068347740?text=${encodeURIComponent(msg)}`);

      // 🔥 Firebase save (safe)
      saveOrderToFirebase(orderData);

      alert("Order Placed ✅");

      setTimeout(()=>{
          localStorage.removeItem("cart");
          location.reload();
      },1000);
  }

  // 🔥 Firebase function
  async function saveOrderToFirebase(order){
      try{
          if(!window.db){
              console.log("Firebase not ready ❌");
              return;
          }

          await window.addDoc(window.collection(window.db, "orders"), order);

          console.log("Saved 🔥");
          alert("Order saved to database ✅");

      }catch(e){
          console.log("Error:", e);
          alert("Error saving order ❌");
      }
  }

  loadCart();
</script>

<!-- 🔥 FIREBASE -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
  import { getFirestore, addDoc, collection } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDdPkJcjawP46Bl81zr6KDl_eGiIwO7dCE",
    authDomain: "lasa-cuisine.firebaseapp.com",
    projectId: "lasa-cuisine",
    storageBucket: "lasa-cuisine.firebasestorage.app",
    messagingSenderId: "653046423280",
    appId: "1:653046423280:web:5739519d03f5c1cb45ac35"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  // 🔥 GLOBAL
  window.db = db;
  window.addDoc = addDoc;
  window.collection = collection;

  console.log("Firebase Ready ✅");
</script>

</body>
</html>
