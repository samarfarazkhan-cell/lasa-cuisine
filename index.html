<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Lasa Cuisine</title>

    <style>
        body {
            font-family: Arial;
            background: #f5f5f5;
            padding: 20px;
            transition: 0.3s;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .cart-btn {
            background: black;
            color: white;
            padding: 10px 15px;
            border-radius: 8px;
            text-decoration: none;
            margin-left: 10px;
        }

        .badge {
            background: red;
            color: white;
            border-radius: 50%;
            padding: 3px 8px;
            font-size: 12px;
        }

        .container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .card {
            background: white;
            border-radius: 15px;
            padding: 15px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .qty {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 10px;
        }

        .qty button {
            background: black;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 6px;
            cursor: pointer;
        }

        input {
            padding: 10px;
            border-radius: 8px;
        }

        /* 🌙 DARK MODE */
        .dark {
            background: #121212;
            color: white;
        }

        .dark .card {
            background: #1e1e1e;
        }

        .dark .cart-btn {
            background: white;
            color: black;
        }

        .dark input {
            background: #2c2c2c;
            color: white;
        }

        .dark .qty button {
            background: white;
            color: black;
        }

        .dark h1 {
            color: #ff8080;
        }
    </style>
</head>

<body>

<div class="header">
    <h1>Lasa Cuisine 🍽</h1>

    <div>
        <button onclick="toggleDark()" id="darkBtn">🌙</button>

        <input type="text" id="search" placeholder="Search..." onkeyup="searchFood()">

        <a href="history.html" class="cart-btn">Orders 📜</a>
        <a href="admin-login.html" class="cart-btn">Admin 📊</a>

        <a href="cart.html" class="cart-btn">
            Cart 🛒 <span id="cart-count" class="badge">0</span>
        </a>
    </div>
</div>

<div class="container" id="food-list"></div>

<script>

    let cart = JSON.parse(localStorage.getItem("cart")) || [];
    let foods = [];

    // LOAD FOODS
    async function loadFoods() {
        let container = document.getElementById("food-list");
        container.innerHTML = "Loading...";

        try {
            let res = await fetch("http://localhost:8080/foods");
            foods = await res.json();

            container.innerHTML = "";

            foods.forEach(food => {
                let div = document.createElement("div");
                div.className = "card";

                div.innerHTML = `
    <img src="http://localhost:8080${food.image}"
     onerror="this.src='https://via.placeholder.com/200'"
     style="width:100%; height:150px; object-fit:cover; border-radius:10px;">
    <h3>${food.name}</h3>
    <p>₹${food.price}</p>

    <div class="qty">
        <button onclick="decreaseQty('${food.name}')">➖</button>
        <span id="qty-${food.name}">0</span>
        <button onclick="increaseQty('${food.name}', ${food.price})">➕</button>
    </div>
`;

                container.appendChild(div);
            });

            updateUI();

        } catch {
            container.innerHTML = "❌ Backend not running";
        }
    }

    // INCREASE
    function increaseQty(name, price) {
        let item = cart.find(i => i.item === name);

        if (item) item.qty++;
        else cart.push({ item: name, price: price, qty: 1 });

        localStorage.setItem("cart", JSON.stringify(cart));
        updateCartCount();
        updateUI();
    }

    // DECREASE
    function decreaseQty(name) {
        let item = cart.find(i => i.item === name);

        if (item) {
            item.qty--;
            if (item.qty <= 0) {
                cart = cart.filter(i => i.item !== name);
            }
        }

        localStorage.setItem("cart", JSON.stringify(cart));
        updateCartCount();
        updateUI();
    }

    // UPDATE UI
    function updateUI() {
        foods.forEach(food => {
            let el = document.getElementById(`qty-${food.name}`);
            let item = cart.find(i => i.item === food.name);
            if (el) el.innerText = item ? item.qty : 0;
        });
    }

    // CART COUNT
    function updateCartCount() {
        let total = cart.reduce((sum, item) => sum + item.qty, 0);
        document.getElementById("cart-count").innerText = total;
    }

    // SEARCH
    function searchFood() {
        let input = document.getElementById("search").value.toLowerCase();
        document.querySelectorAll(".card").forEach(card => {
            card.style.display = card.innerText.toLowerCase().includes(input) ? "" : "none";
        });
    }

    // DARK MODE
    function toggleDark() {
        document.body.classList.toggle("dark");

        let btn = document.getElementById("darkBtn");

        if (document.body.classList.contains("dark")) {
            btn.innerText = "☀️";
            localStorage.setItem("theme", "dark");
        } else {
            btn.innerText = "🌙";
            localStorage.setItem("theme", "light");
        }
    }

    // LOAD THEME
    if (localStorage.getItem("theme") === "dark") {
        document.body.classList.add("dark");
        document.getElementById("darkBtn").innerText = "☀️";
    }

    // INIT
    loadFoods();
    updateCartCount();

</script>

</body>
</html>
