<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Your Cart</title>

  <style>
    body {
        font-family: Arial;
        margin: 0;
        color: white;

        background:
        linear-gradient(rgba(0,0,0,0.8), rgba(0,0,0,0.9)),
        url("images/bg.jpeg");

        background-size: cover;
        background-position: center;
        background-attachment: fixed;
    }

    .cart-wrapper {
        max-width: 600px;
        margin: 40px auto;
        padding: 30px;
        background: rgba(20,20,20,0.9);
        border-radius: 15px;
        box-shadow: 0 0 30px rgba(0,0,0,0.5);
    }

    h1 {
        text-align: center;
    }

    .item {
        display: flex;
        justify-content: space-between;
        background: #1a1a1a;
        padding: 10px;
        border-radius: 10px;
        margin-top: 10px;
    }

    .qty button {
        padding: 6px 12px;
        border: none;
        background: black;
        color: white;
        border-radius: 6px;
        cursor: pointer;
    }

    .qty span {
        margin: 0 10px;
        font-size: 18px;
    }

    #total {
        text-align: center;
        margin-top: 20px;
        color: #ff6b6b;
    }

    .form-box {
        margin-top: 20px;
    }

    .form-box input, .form-box textarea {
        width: 100%;
        padding: 10px;
        margin-top: 10px;
        border-radius: 8px;
        border: none;
    }

    .order-btn {
        width: 100%;
        margin-top: 20px;
        padding: 12px;
        background: #25D366;
        border: none;
        border-radius: 8px;
        color: white;
        font-size: 16px;
        cursor: pointer;
    }
  </style>
</head>

<body>

<div class="cart-wrapper">

  <h1>Your Cart 🛒</h1>

  <div id="cart-items"></div>

  <h3 id="total"></h3>

  <div class="form-box">
    <input type="text" id="name" placeholder="Your Name">
    <input type="text" id="phone" placeholder="Phone Number">
    <textarea id="address" placeholder="Address"></textarea>
  </div>

  <button class="order-btn" onclick="placeOrder()">Order on WhatsApp</button>

</div>

<script>

  let cart = JSON.parse(localStorage.getItem("cart")) || [];

  function loadCart(){

      let container = document.getElementById("cart-items");
      let total = 0;
      container.innerHTML = "";

      if(cart.length === 0){
          container.innerHTML = "<p style='text-align:center;color:gray;'>Cart is empty 🛒</p>";
          document.getElementById("total").innerText = "";
          return;
      }

      cart.forEach((item, index)=>{

          total += item.price * item.qty;

          container.innerHTML += `
          <div class="item">
              <div>${item.item}</div>
              <div class="qty">
                  <button onclick="dec(${index})">-</button>
                  <span>${item.qty}</span>
                  <button onclick="inc(${index})">+</button>
                  ₹${item.price * item.qty}
              </div>
          </div>
          `;
      });

      document.getElementById("total").innerText = "Total: ₹" + total;
  }

  function inc(i){
      cart[i].qty++;
      save();
  }

  function dec(i){
      cart[i].qty--;
      if(cart[i].qty <= 0) cart.splice(i,1);
      save();
  }

  function save(){
      localStorage.setItem("cart", JSON.stringify(cart));
      loadCart();
  }

  /* WHATSAPP ORDER */
  function placeOrder(){

      let name = document.getElementById("name").value;
      let phone = document.getElementById("phone").value;
      let address = document.getElementById("address").value;

      if(!name || !phone || !address){
          alert("Please fill all details");
          return;
      }

      if(cart.length === 0){
          alert("Cart is empty ❌");
          return;
      }

      // SAVE ORDER
      saveOrder(name, phone, address, cart);

      let message = "🛒 New Order\n\n";

      cart.forEach(item=>{
          message += `${item.item} x ${item.qty} = ₹${item.price * item.qty}\n`;
      });

      let total = cart.reduce((s,i)=>s + i.price*i.qty,0);

      message += `\nTotal: ₹${total}\n\n`;
      message += `Name: ${name}\nPhone: ${phone}\nAddress: ${address}`;

      let number = "919068347740";

      let url = `https://wa.me/${number}?text=${encodeURIComponent(message)}`;

      window.open(url, "_blank");

      alert("Order Placed Successfully ✅");

      // 🔥 FIX: Delay clear (important)
      setTimeout(()=>{
          localStorage.removeItem("cart");
          window.location.reload();
      }, 1500);
  }

  function saveOrder(name, phone, address, cart){

      let orders = JSON.parse(localStorage.getItem("orders")) || [];

      let newOrder = {
          name,
          phone,
          address,
          items: cart,
          status: "Pending",
          date: new Date().toISOString() // 🔥 FIXED DATE FORMAT
      };

      orders.push(newOrder);

      localStorage.setItem("orders", JSON.stringify(orders));
  }

  loadCart();

</script>

</body>
</html>
