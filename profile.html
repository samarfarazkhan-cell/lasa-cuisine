<!DOCTYPE html>
<html>
<head>
    <title>User Profile</title>
    <style>
        body {background:#0b0b0b;color:white;font-family:Arial;text-align:center;padding:40px;}
        .box {background:#1a1a1a;padding:30px;border-radius:15px;width:300px;margin:auto;}
        input {width:100%;padding:10px;margin:10px 0;border:none;border-radius:8px;}
        button {padding:10px;width:100%;border:none;border-radius:8px;margin-top:10px;cursor:pointer;}
    </style>
</head>
<body>

<div class="box">
    <h2>👤 Profile</h2>

    <input id="name">
    <input id="phone">

    <button onclick="save()">Save</button>
    <button onclick="logout()" style="background:red;color:white;">Logout</button>
</div>

<script>
    let user = JSON.parse(localStorage.getItem("userData"));

    if(user){
        document.getElementById("name").value = user.name;
        document.getElementById("phone").value = user.phone;
    }

    function save(){
        let name = document.getElementById("name").value;
        let phone = document.getElementById("phone").value;

        localStorage.setItem("userData", JSON.stringify({name, phone}));
        alert("Saved ✅");
    }

    function logout(){
        localStorage.removeItem("userData");
        window.location.href = "user-login.html";
    }
</script>

</body>
</html>
