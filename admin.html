<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Admin Panel</title>

  <style>
    body {
        font-family: Arial;
        background: #0b0b0b;
        color: white;
        margin: 0;
    }

    h1 {
        text-align: center;
        margin-top: 20px;
    }

    .container {
        max-width: 900px;
        margin: auto;
    }

    .card {
        background: #1a1a1a;
        padding: 15px;
        margin: 15px;
        border-radius: 12px;
        box-shadow: 0 0 10px rgba(0,0,0,0.5);
    }

    button {
        margin-top: 10px;
        padding: 6px 10px;
        border: none;
        border-radius: 6px;
        cursor: pointer;
    }

    .done { background: green; color: white; }
    .delete { background: red; color: white; }

    .empty {
        text-align:center;
        color:gray;
        margin-top:50px;
    }
  </style>
</head>

<body>

<!-- 🔐 Login Check -->
<script>
  if(localStorage.getItem("user") !== "admin"){
      alert("Login first");
      window.location.href = "login.html";
  }
</script>

<h1>📊 Admin Panel</h1>

<div style="text-align:center;">
  <button onclick="logout()">Logout</button>
</div>

<div class="container" id="orders"></div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
  import { getFirestore, collection, onSnapshot, doc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDdPkJcjawP46Bl81zr6KDl_eGiIwO7dCE",
    authDomain: "lasa-cuisine.firebaseapp.com",
    projectId: "lasa-cuisine",
    storageBucket: "lasa-cuisine.firebasestorage.app",
    messagingSenderId: "653046423280",
    appId: "1:653046423280:web:5739519d03f5c1cb45ac35"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  const container = document.getElementById("orders");

  onSnapshot(collection(db, "orders"), (snapshot)=>{

      container.innerHTML = "";

      if(snapshot.empty){
          container.innerHTML = "<p class='empty'>No orders yet 📭</p>";
          return;
      }

      // 🔥 Convert to array + reverse (latest first)
      let orders = [];
      snapshot.forEach(docSnap=>{
          orders.push({id: docSnap.id, data: docSnap.data()});
      });

      orders.reverse();

      orders.forEach(({id, data: order})=>{

          const total = (order.items || []).reduce(
              (s,i)=> s + (i.price||0)*(i.qty||0), 0
          );

          let html = `
          <div class="card">
              <h3>₹${total}</h3>
              <p>${order.time || ""}</p>
              <p>👤 ${order.name || ""}</p>
              <p>📞 ${order.phone || ""}</p>
              <p>📍 ${order.address || ""}</p>

              <p style="color:${order.status === 'Pending' ? 'orange' : 'lime'}; font-weight:bold;">
                  ${order.status}
              </p>
          `;

          (order.items || []).forEach(i=>{
              html += `<p>• ${i.item} x ${i.qty}</p>`;
          });

          html += `
              <button class="done" onclick="toggleStatus('${id}', '${order.status}')">
                  ${order.status === "Pending" ? "Mark Completed" : "Mark Pending"}
              </button>

              <button class="delete" onclick="deleteOrder('${id}')">
                  Delete
              </button>
          </div>
          `;

          container.innerHTML += html;
      });

  });

  // 🔁 Status toggle
  window.toggleStatus = async (id, status)=>{
      const ref = doc(db, "orders", id);
      await updateDoc(ref, {
          status: status === "Pending" ? "Completed" : "Pending"
      });
  };

  // 🗑 Delete with confirmation
  window.deleteOrder = async (id)=>{
      if(confirm("Delete this order?")){
          const ref = doc(db, "orders", id);
          await deleteDoc(ref);
      }
  };

</script>

<script>
  function logout(){
      localStorage.removeItem("user");
      window.location.href = "login.html";
  }
</script>

</body>
</html>
